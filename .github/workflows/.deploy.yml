name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Clean dist/src folder folder
        run: rm -rf dist/src

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Copy pages to dist/src/pages
        run: mkdir -p dist/src/pages && cp -r src/pages/* dist/src/pages/

      - name: copy assets to dist/src
        run: mkdir -p dist/src/assets && cp -r src/assets/* dist/src/assets/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
